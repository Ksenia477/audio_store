{% extends "base.html" %}

{% block title %}Новый пароль | WSTER{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="page-heading">
        <p class="eyebrow">Аккаунт</p>
        <h1>Новый пароль</h1>
    </div>

    {% if validlink %}
        <form class="form-panel" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сохранить пароль</button>
        </form>
    {% else %}
        <div class="form-panel">
            <p>Ссылка недействительна или уже была использована.</p>
            <a class="primary-link" href="{% url 'users:password_reset' %}">Запросить новую</a>
        </div>
    {% endif %}
</section>
{% endblock %}
